<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
</head>
<body>
<title>SoftPlan 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de comandos no topo, biblioteca de produtos à esquerda, folha branca do planograma ao centro, inspetor e ocupação à direita */
:root{
  --bg:#e8eef5; --panel:#fbfcfe; --panel-2:#f1f5fa; --line:#d3dce7; --fg:#0f1b2d; --muted:#5a6a80;
  --accent:#1460d6; --accent-ink:#ffffff; --accent-soft:#dde9fb;
  --danger:#c0312b; --danger-soft:#fbe4e2; --warn:#9a6200; --stage:#dce4ee;
  --font-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c121c; --panel:#121a27; --panel-2:#182233; --line:#26344a; --fg:#e3ebf6; --muted:#94a4bb;
  --accent:#3fb3ff; --accent-ink:#04213a; --accent-soft:#16304d;
  --danger:#ff7b72; --danger-soft:#3a1f1d; --warn:#e3a740; --stage:#080d15; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c121c; --panel:#121a27; --panel-2:#182233; --line:#26344a; --fg:#e3ebf6; --muted:#94a4bb;
  --accent:#3fb3ff; --accent-ink:#04213a; --accent-soft:#16304d;
  --danger:#ff7b72; --danger-soft:#3a1f1d; --warn:#e3a740; --stage:#080d15; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;margin:0}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:52px;width:auto;display:block;flex:none;margin:-4px 0}
.ver{font-family:var(--font-num);font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 6px;align-self:flex-end;margin-bottom:6px;margin-left:-6px}
.pastebox{width:100%;border:1.5px dashed var(--line);background:var(--panel-2);border-radius:7px;padding:8px 10px;font-size:12.5px;color:var(--fg);caret-color:transparent;cursor:pointer}
.pastebox::placeholder{color:var(--muted)}
.pastebox:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
#planName{font-weight:500;font-size:16px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:min(210px,52vw)}
#planName:hover{border-color:var(--line)}
#planName:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.save-state{font-size:11.5px;color:var(--muted);max-width:120px;line-height:1.2}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-left:auto}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 11px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
a.btn{text-decoration:none;display:inline-block;color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 8px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.zoomval{font-family:var(--font-num);font-size:12px;min-width:44px;text-align:center;color:var(--muted)}

/* corpo */
.main{display:grid;grid-template-columns:272px minmax(0,1fr) 312px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side.right{border-right:0;border-left:1px solid var(--line);overflow:auto}
.side-head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.side-head .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:7px 10px}
.lib{overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start;flex:1;min-height:0}
.libtools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.libtools .btn{padding:5px 4px;font-size:12px;white-space:normal;line-height:1.15}
.lib.over{background:var(--accent-soft)}
.card{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:grab;touch-action:none;user-select:none;min-width:0;text-align:left}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .thumb{height:60px;background:#fff;border-radius:5px;display:flex;align-items:flex-end;justify-content:center;padding:5px;overflow:hidden}
.noimg{font-size:10px;color:#8a96a6;align-self:center;text-align:center}
.card .thumb img{max-height:100%;max-width:100%;object-fit:contain;pointer-events:none}
.card .nm{font-size:11px;font-weight:500;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .dim{font-family:var(--font-num);font-size:10px;color:var(--muted)}
.card .uses{position:absolute;top:3px;right:3px;font-family:var(--font-num);font-size:10px;font-weight:500;color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:0 5px;line-height:16px}
.lib-empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:var(--r);padding:18px 14px;color:var(--muted);font-size:13px;line-height:1.5;text-align:center}
.sample-note{margin:0 10px 10px;padding:9px 11px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}

/* palco */
.stage{background:var(--stage);overflow:auto;min-height:0;position:relative;padding:24px}
.sheet{position:relative;background:#ffffff;margin:0 auto;box-shadow:0 1px 2px rgba(10,20,15,.10),0 10px 30px rgba(10,20,15,.10);user-select:none}
.zone{position:absolute;z-index:1;border-radius:3px;cursor:pointer}
.zone:hover{background:rgba(20,96,214,.04)}
.zone.sel{background:rgba(20,96,214,.07);outline:1.5px dashed #1460d6;outline-offset:2px}
.zone .hint{position:absolute;inset:0 0 auto 0;bottom:auto;display:flex;align-items:center;justify-content:center;color:#8a958f;font-size:12px;pointer-events:none;text-align:center;padding:0 8px}
.bar{position:absolute;z-index:4;pointer-events:none;border-radius:2px;background:linear-gradient(#ffffff 0,#f4f6f8 12%,#e6eaee 60%,#d3d9df 100%);box-shadow:inset 0 -1px 0 #a9b2bb,inset 0 1px 0 #c3cad1}
.bartop{position:absolute;z-index:1;pointer-events:none;background:linear-gradient(#bfc6cd,#dfe4e8)}
.panel{position:absolute;z-index:0;pointer-events:none;background:#eef1f4}
.upright{position:absolute;z-index:0;pointer-events:none;background:linear-gradient(90deg,#c4cad1,#dde2e7 45%,#c4cad1)}
.cshadow{position:absolute;z-index:2;pointer-events:none}
.ruler{position:absolute;z-index:5;pointer-events:none;height:9px;border-top:1px solid #b8c1cb}
.ruler span{position:absolute;font:500 7px/1 var(--font-num);color:#8591a0;transform:translateX(-50%)}
.ruler i{position:absolute;top:0;width:1px;background:#b8c1cb}
.seg{position:absolute;z-index:2;cursor:pointer}
.seg.sel{outline:2px solid #1460d6;outline-offset:2px}
.seg-handle{position:absolute;right:-7px;top:50%;width:14px;height:26px;margin-top:-13px;border-radius:4px;background:#ffffff;border:2px solid #1460d6;cursor:ew-resize;touch-action:none}
.limit{position:absolute;z-index:4;width:0;border-left:2px dashed #c0312b;pointer-events:none}
.item{position:absolute;z-index:3;cursor:grab;touch-action:none}
.item img{position:absolute;object-fit:contain;object-position:center bottom;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 var(--sy) var(--sb) rgba(0,0,0,.22))}
.item .ph{position:absolute;background:#e6e9e7;border:1px solid #c5ccc8;display:flex;align-items:center;justify-content:center;font-size:10px;color:#56625c;text-align:center;overflow:hidden}
.item:hover{outline:1px solid rgba(20,96,214,.55)}
.item.sel{outline:2px solid #1460d6;outline-offset:1px}
.item.bad::after{content:"";position:absolute;inset:0;background:rgba(192,49,43,.16);outline:2px solid #c0312b;pointer-events:none}
.item.dragsrc{opacity:.3}
.modlabel{position:absolute;z-index:5;font-size:11.5px;font-weight:600;border:1px solid #d6ddd9;background:#ffffff;color:#3d4843;border-radius:5px;padding:2px 7px;cursor:pointer;white-space:nowrap}
.modlabel.sel{border-color:#1460d6;color:#1460d6}
.warnchip{position:absolute;z-index:5;background:#c0312b;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;pointer-events:none}
.legend-line{position:absolute;pointer-events:none}
.legend-txt{position:absolute;pointer-events:none;color:#333;white-space:nowrap;transform:translateX(-50%);font-family:var(--font-ui)}
#dropline{position:absolute;z-index:6;width:3px;margin-left:-1.5px;background:#1460d6;border-radius:2px;pointer-events:none}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.85;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ghost img{height:70px;display:block}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}

/* inspetor */
.insp{padding:14px;display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--line)}
.insp h3{font-size:15px;margin:0;font-weight:600;text-wrap:balance}
.insp .sub{font-size:12px;color:var(--muted);margin-top:2px}
.grp{display:flex;flex-direction:column;gap:8px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 8px;color:var(--fg);width:100%;min-width:0}
input[type=number]{font-family:var(--font-num);font-size:13px}
.full{grid-column:1/-1}
textarea{font:inherit;resize:vertical}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.segrow,.legrow{display:grid;grid-template-columns:1fr 78px 28px;gap:6px;align-items:center;padding:4px;border-radius:7px}
.legrow{grid-template-columns:34px 1fr 28px}
.segrow.sel{background:var(--accent-soft)}
.swatch{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel-2);cursor:pointer}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;border-radius:5px;height:28px}
.x:hover{background:var(--danger-soft);color:var(--danger)}
.meter{height:8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.meter.over i{background:var(--danger)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.kv b{font-family:var(--font-num);font-weight:500}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.prodimg.chk{background:repeating-conic-gradient(#e9ecea 0 25%, #ffffff 0 50%) 0 0/16px 16px}
.range{display:flex;align-items:center;gap:10px}.range input{flex:1;accent-color:var(--accent)}.range b{font-family:var(--font-num);font-weight:500;font-size:12px;min-width:24px;text-align:right}
.prodimg{background:#fff;border:1px solid var(--line);border-radius:var(--r);height:140px;display:flex;align-items:flex-end;justify-content:center;padding:8px}
.prodimg img{max-height:100%;max-width:100%;object-fit:contain}
.step{display:flex;align-items:center;gap:6px}
.step{flex-wrap:wrap}.step input{width:64px;text-align:center}
.step .btn{width:34px;padding:6px 0;text-align:center}

.stats{padding:14px;display:flex;flex-direction:column;gap:12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.srow:hover{background:var(--panel-2)}
.srow.sel{border-color:var(--accent)}
.srow .lbl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .val{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.srow .meter{grid-column:1/-1}
.srow.over .val{color:var(--danger)}
.ptab{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px;gap:6px;padding:6px 9px;font-size:12px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.prow:first-child{border-top:0}
.prow:not(.ph):hover{background:var(--panel-2)}
.prow.ph{cursor:default;background:var(--panel-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.prow span:not(:first-child){text-align:right;font-family:var(--font-num)}
.prow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow span b{font-family:var(--font-num);font-weight:500;color:var(--accent);margin-right:6px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{background:var(--danger-soft);color:var(--danger);border-radius:7px;padding:8px 10px;font-size:12.5px;line-height:1.4;cursor:pointer}
.ok{font-size:12.5px;color:var(--muted)}
.total{display:flex;gap:10px}
.total div{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.total small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.total b{font-family:var(--font-num);font-weight:500;font-size:16px}

[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:150;background:rgba(8,14,24,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);color:var(--fg);border-radius:12px;width:min(760px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.mhead h3{margin:4px 0 0;font-size:15px;font-weight:600;word-break:break-all}
.mbody{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.smimg{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto}
.smimg img{display:block;max-width:100%;height:auto;margin:0 auto}
.smpdf{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.smlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:200;max-width:calc(100% - 32px)}
.kbd{font-family:var(--font-num);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel-2)}

@media (max-width:1100px){.main{grid-template-columns:240px minmax(0,1fr) 280px}}
@media (max-width:900px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side.right{border-left:0}
  .lib{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));max-height:300px}
  .stage{height:62vh;padding:16px}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===== Constantes de geometria (em cm) ===== */
const BASE = 6;                      // px por cm no zoom 100%
const G = { pad:6, modGap:7, shelfGap:3, bar:3.2, top:1.1, facGap:0.15, up:1.4, panelTop:2.5, shY:0.12, shB:0.35 };
let showRuler = true; try { showRuler = localStorage.getItem('softplan-ruler') !== '0'; } catch(e){}

let S = null;              // estado com histórico: {plan, products}
let origs = {}, bgTol = 30;            // productId -> imagem original antes do recorte
let imgs = {};             // productId -> dataURL (fora do histórico)
let urlCache = {};         // productId -> blob URL
let undoStack = [], redoStack = [], lastKey = null, lastKeyTime = 0;
let sel = null;            // {type:'item'|'shelf'|'seg'|'module'|'product', ...}
let zoom = 1, L = null, drag = null, replaceTarget = null;

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 1) => Number(n || 0).toLocaleString('pt-BR', {maximumFractionDigits: d});
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ===== Modelo ===== */
function newShelf(w = 90, h = 25, d = 30){ return {id:uid(), width:w, height:h, depth:d, segments:[], items:[]}; }
function newModule(n){ return {id:uid(), name:'Módulo ' + n, shelves:[newShelf(90,22), newShelf(90,26), newShelf(90,30)]}; }
function defaultLegends(){ return [{id:uid(), name:'Core Range', color:'#1a9fe0'}, {id:uid(), name:'Extended Range', color:'#e2147a'}]; }
const prod = id => S.products.find(p => p.id === id);
const legend = id => S.plan.legends.find(l => l.id === id);
function findShelf(id){
  for (const m of S.plan.modules){ const i = m.shelves.findIndex(s => s.id === id); if (i >= 0) return {mod:m, shelf:m.shelves[i], si:i}; }
  return null;
}
/* Faceamento: frentes × unidades em profundidade × empilhamento */
function calcItem(it, sh, p){
  const auto = p.d > 0 ? Math.max(1, Math.floor((sh.depth + 1e-6) / p.d)) : 1;
  const dep = it.depth || auto, st = p.stackable === false ? 1 : (it.stack || 1);
  return {auto, dep, st, units: it.facings * dep * st, overZ: p.d * dep > sh.depth + 1e-6, cubU: p.w * p.h * p.d};
}
function usesOf(pid){ let n = 0; S.plan.modules.forEach(m => m.shelves.forEach(s => s.items.forEach(it => { if (it.productId === pid) n += it.facings; }))); return n; }
function sanitize(){
  const ids = new Set(S.products.map(p => p.id));
  S.plan.legends = S.plan.legends || []; S.plan.info = S.plan.info || {};
  S.products.forEach(p => { if (p.code == null) p.code = ''; });
  S.plan.modules.forEach(m => m.shelves.forEach(s => {
    s.items = s.items.filter(it => ids.has(it.productId));
    s.depth = s.depth > 0 ? s.depth : 30;
    s.items.forEach(it => { it.facings = Math.max(1, Math.round(it.facings || 1)); it.stack = Math.max(1, Math.round(it.stack || 1)); it.rot = [0, 90, 180, 270].includes(it.rot) ? it.rot : 0; it.depth = it.depth ? Math.max(1, Math.round(it.depth)) : null; });
    s.segments = s.segments || [];
    s.segments.forEach(g => { if (g.legendId && !legend(g.legendId)) g.legendId = null; });
  }));
}

/* ===== Imagens ===== */
function urlFor(pid){
  if (urlCache[pid]) return urlCache[pid];
  const d = imgs[pid]; if (!d) return '';
  try {
    const [head, b64] = d.split(',');
    const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/png';
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    urlCache[pid] = URL.createObjectURL(new Blob([u], {type:mime}));
  } catch(e){ urlCache[pid] = d; }
  return urlCache[pid];
}
function setImage(pid, dataURL){ if (urlCache[pid] && urlCache[pid].startsWith('blob:')) URL.revokeObjectURL(urlCache[pid]); delete urlCache[pid]; imgs[pid] = dataURL; }
function readFileAsDataURL(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function prepareImage(file){
  let d = await readFileAsDataURL(file);
  const im = await loadImg(d);
  let w = im.naturalWidth, h = im.naturalHeight;
  const MAX = 2400;                       // mantém resolução alta para exportação
  if (Math.max(w, h) > MAX){
    const k = MAX / Math.max(w, h); const c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    d = c.toDataURL('image/png'); w = c.width; h = c.height;
  }
  return {dataURL:d, w, h};
}
/* Remoção de fundo: preenche a partir das bordas apenas a cor de fundo conectada a elas,
   suaviza o contorno e recorta as margens vazias. A embalagem não é redesenhada. */
async function cutout(src, tol = 30, force = false){
  const im = await loadImg(src);
  const w = im.naturalWidth, h = im.naturalHeight, N = w * h;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(im, 0, 0);
  const id = x.getImageData(0, 0, w, h), d = id.data;
  const step = Math.max(1, Math.floor((w + h) / 600));
  const samples = []; let n = 0, transp = 0;
  const take = (px, py) => { const i = (py * w + px) * 4; n++; if (d[i + 3] < 20) transp++; else samples.push(i); };
  for (let i = 0; i < w; i += step){ take(i, 0); take(i, h - 1); }
  for (let j = 0; j < h; j += step){ take(0, j); take(w - 1, j); }
  let mode = 'none', br = 0, bgc = 0, bb = 0;
  if (transp / n > 0.6) mode = 'trim';
  else if (samples.length){
    const med = k => { const a = samples.map(i => d[i + k]).sort((p, q) => p - q); return a[a.length >> 1]; };
    br = med(0); bgc = med(1); bb = med(2);
    const near = samples.filter(i => Math.max(Math.abs(d[i] - br), Math.abs(d[i + 1] - bgc), Math.abs(d[i + 2] - bb)) < tol).length / samples.length;
    if (near > 0.75 || force) mode = 'cut';
  }
  if (mode === 'none') return null;
  const dist = p => { const i = p * 4; return Math.max(Math.abs(d[i] - br), Math.abs(d[i + 1] - bgc), Math.abs(d[i + 2] - bb)); };
  let removed = 0;
  if (mode === 'cut'){
    const bgm = new Uint8Array(N), q = new Int32Array(N); let qh = 0, qt = 0;
    const ok = p => d[p * 4 + 3] < 20 || dist(p) < tol;
    const seed = p => { if (!bgm[p] && ok(p)){ bgm[p] = 1; q[qt++] = p; } };
    for (let i = 0; i < w; i++){ seed(i); seed((h - 1) * w + i); }
    for (let j = 0; j < h; j++){ seed(j * w); seed(j * w + w - 1); }
    while (qh < qt){
      const p = q[qh++], px = p % w;
      if (px > 0) seed(p - 1); if (px < w - 1) seed(p + 1);
      if (p >= w) seed(p - w); if (p < N - w) seed(p + w);
    }
    for (let p = 0; p < N; p++) if (bgm[p]){ d[p * 4 + 3] = 0; removed++; }
    if (removed / N > 0.985) return null;            // sobraria quase nada: não aplica
    // contorno suave: pixels de borda parecidos com o fundo ficam semitransparentes
    for (let p = 0; p < N; p++){
      if (bgm[p]) continue; const px = p % w;
      const edge = (px > 0 && bgm[p - 1]) || (px < w - 1 && bgm[p + 1]) || (p >= w && bgm[p - w]) || (p < N - w && bgm[p + w]);
      if (!edge) continue;
      const dd = dist(p);
      if (dd < tol * 2) d[p * 4 + 3] = Math.min(d[p * 4 + 3], Math.round(255 * clamp((dd - tol) / tol, 0.15, 1)));
    }
    x.putImageData(id, 0, 0);
  }
  // recorte das margens vazias
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) if (d[(y * w + xx) * 4 + 3] > 12){ if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const o = document.createElement('canvas'); o.width = cw; o.height = ch;
  o.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
  return {dataURL:o.toDataURL('image/png'), w:cw, h:ch, mode, removed:removed / N};
}
async function importImage(file){
  const im = await prepareImage(file);
  let r = null; try { r = await cutout(im.dataURL, 30, false); } catch(e){}
  return r ? {orig:im.dataURL, dataURL:r.dataURL, w:r.w, h:r.h, cut:r.mode === 'cut'} : {orig:null, dataURL:im.dataURL, w:im.w, h:im.h, cut:false, complex:true};
}
function imgAspect(pid){ return new Promise(res => { const u = urlFor(pid); if (!u) return res(null); loadImg(u).then(i => res(i.naturalHeight / i.naturalWidth)).catch(() => res(null)); }); }

/* ===== Histórico ===== */
function pushUndo(){ undoStack.push(JSON.stringify(S)); if (undoStack.length > 150) undoStack.shift(); redoStack = []; }
function update(fn, opt = {}){
  const now = Date.now();
  if (!(opt.key && opt.key === lastKey && now - lastKeyTime < 1500)) pushUndo();
  lastKey = opt.key || null; lastKeyTime = now;
  fn();
  if (opt.light) renderLight(); else renderAll();
  scheduleSave();
}
function undo(){ if (!undoStack.length) return; redoStack.push(JSON.stringify(S)); S = JSON.parse(undoStack.pop()); lastKey = null; validateSel(); renderAll(); scheduleSave(); }
function redo(){ if (!redoStack.length) return; undoStack.push(JSON.stringify(S)); S = JSON.parse(redoStack.pop()); lastKey = null; validateSel(); renderAll(); scheduleSave(); }
function validateSel(){
  if (!sel) return;
  if (sel.type === 'product' && !prod(sel.productId)) sel = null;
  else if (sel.type === 'module' && !S.plan.modules.find(m => m.id === sel.moduleId)) sel = null;
  else if (['shelf','seg','item'].includes(sel.type)){
    const f = findShelf(sel.shelfId);
    if (!f) sel = null;
    else if (sel.type === 'item' && !f.shelf.items.find(i => i.id === sel.itemId)) sel = {type:'shelf', shelfId:sel.shelfId};
    else if (sel.type === 'seg') sel = {type:'shelf', shelfId:sel.shelfId};
  }
}

/* ===== Layout (fonte única para editor e exportação) ===== */
const measureCtx = document.createElement('canvas').getContext('2d');
function textW(t, px){ measureCtx.font = `500 ${px}px "Golos Text", system-ui, sans-serif`; return measureCtx.measureText(t).width; }

function layout(sc){
  const P = S.plan, gap = P.gap;
  let x = G.pad * sc, maxBottom = G.pad * sc;
  const mods = [], shelfMap = {}; let pos = 0;
  P.modules.forEach((m, mi) => {
    let y = G.pad * sc, mw = 0; const shelves = [];
    m.shelves.forEach((sh, si) => {
      const clear = sh.height * sc, barH = G.bar * sc, barY = y + clear;
      let c = 0; const items = [];
      sh.items.forEach(it => {
        const p = prod(it.productId); if (!p) return;
        const n = Math.max(1, it.facings | 0);
        if (items.length) c += gap;
        const rot = it.rot || 0, side = rot % 180 !== 0, fw = side ? p.h : p.w, fh = side ? p.w : p.h;
        const start = c, wcm = n * fw + (n - 1) * G.facGap;
        c += wcm;
        const units = [];
        for (let k = 0; k < n; k++) units.push({x: x + (start + k * (fw + G.facGap)) * sc, w: fw * sc});
        const k = calcItem(it, sh, p);
        items.push({item:it, p, pos:++pos, calc:k, rot, fw, fh, uh:fh * sc, st:k.st, x:x + start * sc, w:wcm * sc, h:fh * k.st * sc, y:barY - fh * k.st * sc, units,
                    overX: c > sh.width + 1e-6, overY: fh * k.st > sh.height + 1e-6, overZ:k.overZ, wcm});
      });
      const extent = Math.max(sh.width, c);
      const e = {shelf:sh, mod:m, mi, si, x, y, w:sh.width * sc, ew:extent * sc, clear, barY, barH, items,
                 usedCm:c, extentCm:extent};
      shelves.push(e); shelfMap[sh.id] = e;
      mw = Math.max(mw, extent * sc);
      y = barY + barH + G.shelfGap * sc;
    });
    if (!m.shelves.length) mw = 30 * sc;
    const bottom = m.shelves.length ? y - G.shelfGap * sc : G.pad * sc + 10 * sc;
    const pw = Math.max(0, ...m.shelves.map(s => s.width)) * sc || mw;
    const panel = {x:x, y:G.pad * sc - G.panelTop * sc, w:pw, h:bottom - (G.pad * sc - G.panelTop * sc), up:G.up * sc};
    mods.push({mod:m, mi, x, y:G.pad * sc, w:mw, bottom, shelves, panel});
    maxBottom = Math.max(maxBottom, bottom);
    x += mw + G.modGap * sc;
  });
  const W = (P.modules.length ? x - G.modGap * sc : x + 30 * sc) + G.pad * sc;
  const H = maxBottom + G.pad * sc;
  return {sc, W, H, mods, shelfMap, back:P.showBack !== false};
}

/* ===== Render: editor ===== */
function renderCanvas(){
  const sc = BASE * zoom; L = layout(sc);
  const sheet = $('#sheet');
  sheet.style.width = L.W + 'px'; sheet.style.height = L.H + 'px';
  let h = '';
  L.mods.forEach(M => {
    const msel = sel && sel.type === 'module' && sel.moduleId === M.mod.id;
    h += `<button class="modlabel${msel ? ' sel' : ''}" data-mod="${M.mod.id}" style="left:${M.x}px;top:${Math.max(3, G.pad * sc / 2 - 11)}px">${esc(M.mod.name)}</button>`;
    if (L.back){ const Q = M.panel;
      h += `<div class="panel" style="left:${Q.x}px;top:${Q.y}px;width:${Q.w}px;height:${Q.h}px"></div>`;
      h += `<div class="upright" style="left:${Q.x - Q.up}px;top:${Q.y}px;width:${Q.up}px;height:${Q.h}px"></div>`;
      h += `<div class="upright" style="left:${Q.x + Q.w}px;top:${Q.y}px;width:${Q.up}px;height:${Q.h}px"></div>`; }
    M.shelves.forEach(E => {
      const sh = E.shelf;
      const zsel = sel && sel.type === 'shelf' && sel.shelfId === sh.id;
      h += `<div class="zone${zsel ? ' sel' : ''}" data-zone="1" data-shelf="${sh.id}" style="left:${E.x}px;top:${E.y}px;width:${E.ew}px;height:${E.clear + E.barH}px">`;
      if (!E.items.length) h += `<div class="hint" style="height:${E.clear}px">Arraste produtos para esta bandeja</div>`;
      h += `</div>`;
      const tH = G.top * sc;
      h += `<div class="bartop" style="left:${E.x}px;top:${E.barY - tH}px;width:${E.w}px;height:${tH}px"></div>`;
      h += `<div class="bar" style="left:${E.x}px;top:${E.barY}px;width:${E.w}px;height:${E.barH}px"></div>`;
      E.items.forEach(I => I.units.forEach(un => { const sw = un.w * 1.04, shh = 0.9 * sc;
        h += `<div class="cshadow" style="left:${un.x + un.w / 2 - sw / 2}px;top:${E.barY - shh / 2}px;width:${sw}px;height:${shh}px;background:radial-gradient(closest-side,rgba(0,0,0,.30),rgba(0,0,0,0))"></div>`; }));
      if (showRuler){
        const lab = 10 * sc < 34 ? 20 : 10;
        h += `<div class="ruler" style="left:${E.x}px;top:${E.barY + E.barH + 1}px;width:${E.w}px">`;
        for (let c = 0; c <= sh.width + 1e-6; c += 5){
          const major = Math.round(c) % 10 === 0;
          h += `<i style="left:${c * sc}px;height:${major ? 3 : 2}px"></i>`;
          if (Math.round(c) % lab === 0 && c > 0 && c < sh.width - 2) h += `<span style="left:${c * sc}px;top:4px">${Math.round(c)}</span>`;
        }
        h += `</div>`;
      }
      if (E.usedCm > sh.width + 1e-6) h += `<div class="limit" style="left:${E.x + E.w}px;top:${E.y}px;height:${E.clear + E.barH}px"></div>`;
      E.items.forEach(I => {
        const isel = sel && sel.type === 'item' && sel.itemId === I.item.id;
        const bad = I.overX || I.overY || I.overZ;
        h += `<div class="item${isel ? ' sel' : ''}${bad ? ' bad' : ''}" data-item="${I.item.id}" data-shelf="${sh.id}" title="${esc(I.p.name)} · ${I.item.facings} frente(s) · ${I.calc.units} unidade(s)" style="left:${I.x}px;top:${I.y}px;width:${I.w}px;height:${I.h}px;--sy:${G.shY * sc}px;--sb:${G.shB * sc}px">`;
        const u = urlFor(I.p.id);
        I.units.forEach(un => { for (let j = 0; j < I.st; j++){
          const pw = I.p.w * sc, ph = I.p.h * sc;
          const st = !I.rot ? `left:${un.x - I.x}px;width:${un.w}px;bottom:${j * I.uh}px;height:${I.uh}px`
            : `left:${un.x - I.x + (un.w - pw) / 2}px;width:${pw}px;bottom:${j * I.uh + (I.uh - ph) / 2}px;height:${ph}px;transform:rotate(${I.rot}deg);object-position:center`;
          h += u ? `<img src="${u}" alt="" draggable="false" style="${st}">` : `<div class="ph" style="${st}">${esc(I.p.name)}</div>`;
        } });
        h += `</div>`;
      });
      const probs = (E.usedCm > sh.width + 1e-6) + E.items.some(i => i.overY || i.overZ);
      if (probs) h += `<div class="warnchip" style="left:${E.x + 4}px;top:${E.y + 4}px">!</div>`;
    });
  });
  h += `<div id="dropline" hidden></div>`;
  sheet.innerHTML = h;
  $('#zoomVal').textContent = Math.round(zoom * 100) + '%';
}

function renderLibrary(){
  const q = $('#search').value.trim().toLowerCase();
  const list = S.products.filter(p => !q || [p.name, p.brand, p.ean, p.code, p.category].join(' ').toLowerCase().includes(q));
  let h = '';
  if (!S.products.length) h = `<div class="lib-empty">Nenhum produto cadastrado.<br>Use <b>Adicionar imagens</b>, solte arquivos aqui ou copie uma imagem e cole no campo acima. Cada imagem vira um produto.</div>`;
  else if (!list.length) h = `<div class="lib-empty">Nenhum produto encontrado para “${esc(q)}”.</div>`;
  list.forEach(p => {
    const u = urlFor(p.id), n = usesOf(p.id);
    const s = sel && sel.type === 'product' && sel.productId === p.id;
    h += `<div class="card${s ? ' sel' : ''}" data-prod="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}">
      <div class="thumb">${u ? `<img src="${u}" alt="" draggable="false">` : '<span class="noimg">sem imagem</span>'}</div>
      <div class="nm">${esc(p.name)}</div>
      <div class="dim">${fmt(p.w)} × ${fmt(p.h)} cm</div>
      ${n ? `<div class="uses" title="${n} frente(s) no planograma">${n}</div>` : ''}
    </div>`;
  });
  $('#lib').innerHTML = h;
  const hasSample = S.products.some(p => p.sample);
  $('#sampleNote').innerHTML = hasSample ? `<div class="sample-note"><span>Produtos de exemplo, apenas para demonstração.</span><button class="btn small" id="bClearSample">Remover</button></div>` : '';
  if (hasSample) arm($('#bClearSample'), () => update(() => {
    const ids = new Set(S.products.filter(p => p.sample).map(p => p.id));
    S.products = S.products.filter(p => !p.sample); sanitize();
    if (sel && sel.type === 'product' && ids.has(sel.productId)) sel = null; validateSel();
  }));
}

function computeAlerts(){
  const out = [];
  L.mods.forEach(M => M.shelves.forEach(E => {
    const sh = E.shelf, tag = `${M.mod.name} · Bandeja ${E.si + 1}`;
    if (E.usedCm > sh.width + 1e-6) out.push({shelfId:sh.id, text:`${tag}: os produtos ultrapassam a largura em ${fmt(E.usedCm - sh.width)} cm (${fmt(E.usedCm)} de ${fmt(sh.width)} cm).`});
    const seen = new Set();
    E.items.forEach(I => {
      if (I.overY && !seen.has('y' + I.p.id)){ seen.add('y' + I.p.id);
        out.push({shelfId:sh.id, itemId:I.item.id, text: I.st > 1
          ? `${tag}: ${I.p.name} empilhado ${I.st}x chega a ${fmt(I.p.h * I.st)} cm, acima da altura útil (${fmt(sh.height)} cm).`
          : `${tag}: ${I.p.name} tem ${fmt(I.p.h)} cm de altura, acima da altura útil (${fmt(sh.height)} cm).`}); }
      if (I.overZ && !seen.has('z' + I.p.id)){ seen.add('z' + I.p.id);
        out.push({shelfId:sh.id, itemId:I.item.id, text:`${tag}: ${I.p.name} com ${I.calc.dep} unidade(s) em profundidade ocupa ${fmt(I.p.d * I.calc.dep)} cm, a bandeja tem ${fmt(sh.depth)} cm.`}); }
    });
  }));
  return out;
}

function renderStats(){
  let h = `<h2>Ocupação</h2>`;
  const T = totals();
  h += `<div class="total"><div><small>Ocupação</small><b>${fmt(T.occ, 0)}%</b></div><div><small>Frentes</small><b>${T.facings}</b></div><div><small>Unidades</small><b>${T.units}</b></div></div>`;
  L.mods.forEach(M => M.shelves.forEach(E => {
    const sh = E.shelf, pct = sh.width ? E.usedCm / sh.width * 100 : 0, over = E.usedCm > sh.width + 1e-6;
    const s = sel && sel.type === 'shelf' && sel.shelfId === sh.id;
    h += `<div class="srow${over ? ' over' : ''}${s ? ' sel' : ''}" data-goshelf="${sh.id}">
      <span class="lbl">${esc(M.mod.name)} · Bandeja ${E.si + 1}</span>
      <span class="val">${fmt(E.usedCm)} / ${fmt(sh.width)} cm · ${fmt(pct, 0)}%</span>
      <div class="meter${over ? ' over' : ''}"><i style="width:${clamp(pct, 0, 100)}%"></i></div></div>`;
  }));
  const agg = aggregate();
  h += `<h2>Faceamento por produto</h2>`;
  h += agg.length ? `<div class="ptab"><div class="prow ph"><span>Produto</span><span>Frentes</span><span>Unid.</span></div>${agg.map(a => `<div class="prow" data-goprod="${a.p.id}"><span><b>${esc(a.p.code || a.p.ean || '—')}</b>${esc(a.p.name)}</span><span>${a.facings}</span><span>${a.units}</span></div>`).join('')}</div>`
                  : `<div class="ok">Nenhum produto no planograma.</div>`;
  const al = computeAlerts();
  h += `<h2>Alertas</h2>`;
  h += al.length ? `<div class="alerts">${al.map(a => `<div class="alert" data-goshelf="${a.shelfId}" ${a.itemId ? `data-goitem="${a.itemId}"` : ''}>${esc(a.text)}</div>`).join('')}</div>`
                 : `<div class="ok">Nenhum problema de espaço encontrado.</div>`;
  $('#stats').innerHTML = h;
}

function aggregate(lay = L){
  const map = new Map();
  lay.mods.forEach(M => M.shelves.forEach(E => E.items.forEach(I => {
    const a = map.get(I.p.id) || {p:I.p, facings:0, units:0, cub:0, pos:[]};
    a.facings += I.item.facings; a.units += I.calc.units; a.cub += I.calc.units * I.calc.cubU; a.pos.push(I.pos);
    map.set(I.p.id, a);
  })));
  return [...map.values()];
}
function totals(lay = L){
  let W = 0, U = 0, f = 0, u = 0, sh = 0;
  lay.mods.forEach(M => M.shelves.forEach(E => { sh++; W += E.shelf.width; U += Math.min(E.usedCm, E.shelf.width); E.items.forEach(I => { f += I.item.facings; u += I.calc.units; }); }));
  return {occ: W ? U / W * 100 : 0, facings:f, units:u, shelves:sh, products:aggregate(lay).length};
}

function bindNum(id, fn, key){ const el = document.getElementById(id); if (!el) return;
  el.addEventListener('input', () => { const v = num(el.value); if (!isFinite(v) || v <= 0) return; update(() => fn(v), {key: key || id, light:true}); }); }
function bindText(id, fn, key){ const el = document.getElementById(id); if (!el) return;
  el.addEventListener('input', () => update(() => fn(el.value), {key: key || id, light:true})); }
function on(id, fn){ const el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
function arm(btn, fn){ if (!btn) return; const t = btn.textContent;
  btn.addEventListener('click', () => { if (btn.dataset.armed){ fn(); return; }
    btn.dataset.armed = '1'; btn.textContent = 'Confirmar'; btn.classList.add('armed');

function startDrag(e, d){
  drag = {...d, sx:e.clientX, sy:e.clientY, started:false, target:null};

}
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    drag.started = true; document.body.classList.add('dragging');
    const pid = drag.kind === 'new' ? drag.productId : curItemById(drag.shelfId, drag.itemId).productId;
    const gh = document.createElement('div'); gh.className = 'ghost';
    const u = urlFor(pid); gh.innerHTML = u ? `<img src="${u}" alt="">` : `<div style="padding:8px;background:#fff;border:1px solid #ccc">${esc(prod(pid).name)}</div>`;
    document.body.appendChild(gh); drag.ghost = gh;
    if (drag.el) drag.el.classList.add('dragsrc');
  }
  drag.ghost.style.transform = `translate(${e.clientX + 10}px, ${e.clientY - 60}px)`;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const shEl = under && under.closest('#sheet [data-shelf]');
  const dl = document.getElementById('dropline');
  if (!shEl){ drag.target = null; if (dl) dl.hidden = true; return; }
  const E = L.shelfMap[shEl.dataset.shelf]; if (!E) return;
  const px = e.clientX - sheetEl.getBoundingClientRect().left;
  let idx = E.items.filter(I => I.x + I.w / 2 < px).length;
  drag.target = {shelfId:E.shelf.id, idx};
  const gp = S.plan.gap * L.sc;
  const lx = idx < E.items.length ? E.items[idx].x - gp / 2 : (E.items.length ? E.items[E.items.length - 1].x + E.items[E.items.length - 1].w + gp / 2 : E.x + 2);

});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null; document.body.classList.remove('dragging');
  if (d.ghost) d.ghost.remove();

    sel = d.kind === 'new' ? {type:'product', productId:d.productId} : {type:'item', shelfId:d.shelfId, itemId:d.itemId};

  if (!d.target){ renderCanvas(); return; }

    }

async function addImageFiles(files){

        if (!target.hasDims) linkedUpd.push([target.id, Math.round(target.w * im.h / im.w * 10) / 10]);

      }

      if (im.cut) cutCount++; else if (im.complex) complexCount++;
      const base = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
      const nm = !base || /^(image|imagem|clipboard|pasted.*)$/i.test(base) ? 'Produto colado ' + (S.products.length + added.length + 1) : base;
      setImage(id, im.dataURL);

      added.push({id, name: digits ? 'Produto ' + digits : nm, code:'', brand:'', category:'', ean:digits, w, h, d:4, stackable:true});
    } catch(err){ toast('Não foi possível ler ' + f.name + '.'); }
  }
  if (!added.length && !linked) return;
  update(() => { S.products.push(...added); linkedUpd.forEach(([id, h]) => { const q = prod(id); if (q) q.h = h; });
    if (added.length) sel = {type:'product', productId:added[added.length - 1].id}; });
  toast((linked ? `${linked} imagem(ns) vinculada(s) pelo EAN ou código` : '') + (linked && added.length ? ', ' : '') + (added.length ? `${added.length} produto(s) novo(s)` : '') + (cutCount ? `, fundo removido em ${cutCount}` : '') +

/* ===== Tabela de produtos (Excel / CSV) ===== */
const COLS = [
  ['code', 'Código', ['codigo', 'cod', 'sku', 'codigo interno', 'codigo do produto', 'cod produto', 'id']],
  ['ean', 'EAN', ['ean', 'gtin', 'codigo de barras', 'cod barras', 'cod. barras', 'barras']],
  ['name', 'Descrição', ['descricao', 'produto', 'nome', 'descricao do produto', 'item']],
  ['brand', 'Marca', ['marca', 'fabricante', 'industria', 'laboratorio']],
  ['category', 'Categoria', ['categoria', 'grupo', 'departamento', 'secao', 'subcategoria']],
  ['w', 'Largura (cm)', ['largura', 'larg', 'l']],
  ['h', 'Altura (cm)', ['altura', 'alt', 'a']],
  ['d', 'Profundidade (cm)', ['profundidade', 'prof', 'p', 'comprimento']],
  ['stackable', 'Empilhável', ['empilhavel', 'empilha', 'pode empilhar']]
];
const plain = v => String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9. ]/g, ' ').replace(/\s+/g, ' ').trim();
function mapHeaders(hdr){
  const map = {};
  hdr.forEach((h, i) => { const k = plain(h); if (!k) return;
    for (const [key, , alias] of COLS){ if (map[key] != null) continue;
      if (alias.some(a => k === a || (a.length > 3 && k.startsWith(a)))){ map[key] = i; break; } } });
  return map;
}
const cellStr = v => typeof v === 'number' ? (Number.isInteger(v) ? v.toFixed(0) : String(v)) : String(v ?? '').trim();
function decodeText(buf){
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf).replace(/^\uFEFF/, ''); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }   // CSV salvo pelo Excel em português
}
function parseCSV(t){
  const first = t.split(/\r?\n/)[0] || '';
  const del = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if (c === '"') q = true;
    else if (c === del){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function importTable(file){
  if (!window.XLSX) return toast('O leitor de planilhas não carregou. Confira a internet e recarregue a página.');
  try {
    let rows;
    if (/\.(csv|txt)$/i.test(file.name)) rows = parseCSV(decodeText(await file.arrayBuffer()));
    else { const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''}); }
    let hi = rows.findIndex(r => { const m = mapHeaders(r); return m.name != null || m.ean != null || m.code != null; });
    if (hi < 0) return toast('Não achei as colunas. A planilha precisa ter pelo menos Descrição, EAN ou Código no cabeçalho.');
    const map = mapHeaders(rows[hi]); let created = 0, updated = 0;
    const get = (r, k) => map[k] != null ? r[map[k]] : '';
    update(() => {
      rows.slice(hi + 1).forEach(r => {
        const ean = cellStr(get(r, 'ean')).replace(/\D/g, ''), code = cellStr(get(r, 'code')), name = cellStr(get(r, 'name'));
        if (!ean && !code && !name) return;
        let p = (ean && S.products.find(q => normKey(q.ean) === normKey(ean))) || (code && S.products.find(q => normKey(q.code) === normKey(code))) || null;
        if (!p){ p = {id:uid(), name: name || ('Produto ' + (ean || code)), code:'', brand:'', category:'', ean:'', w:6, h:10, d:4, stackable:true}; S.products.push(p); created++; }
        else updated++;
        if (name) p.name = name; if (ean) p.ean = ean; if (code) p.code = code;
        const br = cellStr(get(r, 'brand')), ca = cellStr(get(r, 'category')); if (br) p.brand = br; if (ca) p.category = ca;
        let dims = false;
        ['w', 'h', 'd'].forEach(k => { const v = num(get(r, k)); if (isFinite(v) && v > 0){ p[k] = v; dims = true; } });
        if (dims) p.hasDims = true;
        const st = plain(get(r, 'stackable')); if (st) p.stackable = !/^(n|nao|no|0|false)$/.test(st);
        delete p.sample;
      });
    });
    const semImg = S.products.filter(p => !imgs[p.id]).length;
    toast(`${created} produto(s) novo(s) e ${updated} atualizado(s).` + (semImg ? ` ${semImg} sem imagem: use Imagens com o EAN no nome do arquivo.` : ''));
  } catch(err){ toast('Não foi possível ler a planilha: ' + (err && err.message || err)); }
}
async function exportTable(){
  if (!window.XLSX) return toast('O gerador de planilhas não carregou. Confira a internet e recarregue a página.');
  const head = [...COLS.map(c => c[1]), 'Tem imagem', 'Frentes no planograma'];
  const body = S.products.map(p => [p.code || '', p.ean || '', p.name || '', p.brand || '', p.category || '', p.w, p.h, p.d,
    p.stackable === false ? 'Não' : 'Sim', imgs[p.id] ? 'Sim' : 'Não', usesOf(p.id)]);

  ws['!cols'] = [12, 16, 40, 18, 18, 12, 12, 16, 11, 11, 20].map(w => ({wch:w}));

  await saveFile((S.products.length ? 'Produtos ' : 'Modelo produtos ') + fileBase() + '.xlsx', new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

/* ===== Exportação PNG ===== */
async function renderExport(targetW, labels){
  if (document.fonts) await Promise.all([document.fonts.load('600 24px "Golos Text"'), document.fonts.ready]).catch(() => {});
  const wcm = L.W / L.sc, hcm = L.H / L.sc;
  let sc = clamp(targetW / wcm, 10, 45);
  if (wcm * sc * hcm * sc > 50e6) sc = Math.sqrt(50e6 / (wcm * hcm));
  const EL = layout(sc);
  const cv = document.createElement('canvas'); cv.width = Math.ceil(EL.W); cv.height = Math.ceil(EL.H);
  const x = cv.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, cv.width, cv.height);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  const cache = {};
  for (const p of S.products){ const u = urlFor(p.id); if (u){ try { cache[p.id] = await loadImg(u); } catch(e){} } }
  drawLayout(x, EL, cache, labels);
  return {canvas:cv, EL};
}
async function exportPNG(){
  const btn = $('#bExport'); btn.disabled = true; btn.textContent = 'Gerando…';
  try {
    const {canvas} = await renderExport(3600, !!S.plan.numberPng);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await saveFile(fileBase() + '.png', blob);
  } catch(err){ toast('Não foi possível gerar a imagem: ' + (err && err.message || err)); }
  btn.disabled = false; btn.textContent = 'Exportar PNG';
}
function rr(x, X, Y, W, H, r){ r = Math.max(0, Math.min(r, W / 2, H / 2)); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
function vgrad(x, y0, y1, stops){ const g = x.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function drawLayout(x, EL, cache, labels){
  const sc = EL.sc;
  EL.mods.forEach(M => {
    if (EL.back){ const Q = M.panel;
      x.fillStyle = '#eef1f4'; x.fillRect(Q.x, Q.y, Q.w, Q.h);
      [Q.x - Q.up, Q.x + Q.w].forEach(ux => { const g = x.createLinearGradient(ux, 0, ux + Q.up, 0);
        g.addColorStop(0, '#c4cad1'); g.addColorStop(.45, '#dde2e7'); g.addColorStop(1, '#c4cad1'); x.fillStyle = g; x.fillRect(ux, Q.y, Q.up, Q.h); });
    }
    M.shelves.forEach(E => {
      const tH = G.top * sc;
      x.fillStyle = vgrad(x, E.barY - tH, E.barY, [[0, '#bfc6cd'], [1, '#dfe4e8']]); x.fillRect(E.x, E.barY - tH, E.w, tH);
      E.items.forEach(I => I.units.forEach(u => {           // sombra de contato (só na camada de baixo)
        const sw = u.w * 1.04, shh = 0.9 * sc, cx = u.x + u.w / 2;
        x.save(); x.translate(cx, E.barY); x.scale(sw / 2, shh / 2);
        const g = x.createRadialGradient(0, 0, 0, 0, 0, 1); g.addColorStop(0, 'rgba(0,0,0,.30)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = g; x.beginPath(); x.arc(0, 0, 1, 0, Math.PI * 2); x.fill(); x.restore();
      }));
      E.items.forEach(I => {
        const im = cache[I.p.id];
        I.units.forEach(u => { for (let j = 0; j < I.st; j++){
          const base = E.barY - j * I.uh;
          x.save(); x.shadowColor = 'rgba(0,0,0,.22)'; x.shadowBlur = G.shB * sc; x.shadowOffsetY = G.shY * sc;
          if (im && !I.rot){
            const k = Math.min(u.w / im.naturalWidth, I.uh / im.naturalHeight);
            const dw = im.naturalWidth * k, dh = im.naturalHeight * k;
            x.drawImage(im, u.x + (u.w - dw) / 2, base - dh, dw, dh);
          } else if (im){
            const pw = I.p.w * sc, ph = I.p.h * sc, k = Math.min(pw / im.naturalWidth, ph / im.naturalHeight);
            const dw = im.naturalWidth * k, dh = im.naturalHeight * k;
            x.translate(u.x + u.w / 2, base - I.uh / 2); x.rotate(I.rot * Math.PI / 180);
            x.drawImage(im, -dw / 2, -dh / 2, dw, dh);
          } else { x.fillStyle = '#e6e9e7'; x.fillRect(u.x, base - I.uh, u.w, I.uh); }
          x.restore();
        } });
      });
      // frente da prateleira (canaleta)
      x.fillStyle = vgrad(x, E.barY, E.barY + E.barH, [[0, '#ffffff'], [.12, '#f4f6f8'], [.6, '#e6eaee'], [1, '#d3d9df']]);
      rr(x, E.x, E.barY, E.w, E.barH, 2 * sc / 6); x.fill();
      x.fillStyle = '#c3cad1'; x.fillRect(E.x, E.barY, E.w, Math.max(1, sc * 0.08));
      x.fillStyle = '#a9b2bb'; x.fillRect(E.x, E.barY + E.barH - Math.max(1, sc * 0.08), E.w, Math.max(1, sc * 0.08));
      if (labels) E.items.forEach(I => {                     // número da posição na canaleta
        const r = Math.min(E.barH * 0.36, I.w / 2 - 1); if (r < 3) return;
        const cx = I.x + I.w / 2, cy = E.barY + E.barH / 2;
        x.fillStyle = '#1460d6'; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
        x.fillStyle = '#ffffff'; x.textAlign = 'center'; x.textBaseline = 'middle';
        x.font = `600 ${r * (I.pos > 99 ? 0.85 : 1.05)}px "Golos Text", system-ui, sans-serif`; x.fillText(String(I.pos), cx, cy + r * 0.05);
      });
    });
  });
}
/* ===== Exportação PDF ===== */
function pdfTxt(v){ return String(v ?? '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x00-\xFF]/g, ''); }
async function exportPDF(){
  if (!window.jspdf || !window.jspdf.jsPDF){ toast('O gerador de PDF não carregou. Confira a internet e recarregue a página.'); return; }
  const btn = $('#bPdf'); btn.disabled = true; btn.textContent = 'Gerando…';
  try {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const PW = 297, PH = 210, M = 12, BLUE = [20, 96, 214], INK = [15, 27, 45], MUTED = [90, 106, 128];
    const info = S.plan.info || {};
    const header = (title) => {
      const lg = document.querySelector('.logo'); const lr = lg.naturalWidth / lg.naturalHeight || 2;
      doc.addImage(lg.src, 'PNG', M, 7, 13 * lr, 13);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...INK);
      doc.text(pdfTxt(S.plan.name || 'Planograma'), M + 13 * lr + 5, 13.5);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
      const meta = [info.campaign && 'Campanha: ' + info.campaign, info.partner && 'Indústria: ' + info.partner, info.store && 'Loja: ' + info.store,
                    info.period && 'Período: ' + info.period, 'Gerado em ' + new Date().toLocaleDateString('pt-BR')].filter(Boolean).join('    |    ');
      doc.text(pdfTxt(meta), M + 13 * lr + 5, 19);
      if (title){ doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...BLUE); doc.text(pdfTxt(title), PW - M, 13.5, {align:'right'}); }
      doc.setDrawColor(211, 220, 231); doc.setLineWidth(0.3); doc.line(M, 23, PW - M, 23);
    };
    // página 1: imagem numerada + resumo
    header('Planograma');
    const {canvas, EL} = await renderExport(2800, true);
    const T = totals(EL), agg = aggregate(EL);
    const boxH = 15, areaW = PW - 2 * M, areaH = PH - 28 - boxH - 16;
    const k = Math.min(areaW / canvas.width, areaH / canvas.height), iw = canvas.width * k, ih = canvas.height * k;
    doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', M + (areaW - iw) / 2, 27, iw, ih);
    const tiles = [['Ocupação', fmt(T.occ, 0) + '%'], ['Frentes', T.facings], ['Unidades', T.units], ['Produtos', T.products], ['Bandejas', T.shelves]];
    const by = 27 + ih + 5, bw = (areaW - 4 * 4) / 5;
    tiles.forEach(([l, v], i) => {
      const bx = M + i * (bw + 4);
      doc.setFillColor(241, 245, 250); doc.setDrawColor(211, 220, 231); doc.roundedRect(bx, by, bw, boxH, 1.5, 1.5, 'FD');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(...MUTED); doc.text(pdfTxt(l.toUpperCase()), bx + 4, by + 5.5);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...INK); doc.text(pdfTxt(String(v)), bx + 4, by + 12);
    });
    const tbl = {theme:'grid', styles:{font:'helvetica', fontSize:8, cellPadding:1.6, textColor:INK, lineColor:[211, 220, 231], lineWidth:0.2},
                 headStyles:{fillColor:BLUE, textColor:255, fontStyle:'bold'}, alternateRowStyles:{fillColor:[247, 249, 252]},
                 margin:{left:M, right:M, top:28}, didDrawPage:() => header()};
    const right = i => ({[i]:{halign:'right'}});
    const section = (t, y) => { if (y > PH - 40){ doc.addPage(); header(); y = 30; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...BLUE); doc.text(pdfTxt(t), M, y); return y + 3; };
    // página 2: posições
    doc.addPage(); header('Relatório técnico');
    const rows = [];
    EL.mods.forEach(Md => Md.shelves.forEach(E => E.items.forEach(I => rows.push([I.pos, pdfTxt(`${Md.mod.name} · B${E.si + 1}`), pdfTxt(I.p.code || '-'), pdfTxt(I.p.ean || '-'),
      pdfTxt(I.p.name), I.item.facings, I.calc.dep, I.st, I.rot ? I.rot + '°' : '-', I.calc.units, fmt(I.wcm)]))));
    doc.autoTable({...tbl, startY:section('Posições no planograma', 30), head:[['Pos.', 'Local', 'Código', 'EAN', 'Produto', 'Frentes', 'Prof.', 'Camadas', 'Giro', 'Unidades', 'Largura (cm)']], body:rows,
      columnStyles:{0:{halign:'center', cellWidth:11}, ...right(5), ...right(6), ...right(7), 8:{halign:'center'}, ...right(9), ...right(10)}});
    // faceamento por produto
    const prodRows = agg.map(a => [pdfTxt(a.p.code || '-'), pdfTxt(a.p.ean || '-'), pdfTxt(a.p.name), pdfTxt(a.p.category || '-'),
      `${fmt(a.p.w)} x ${fmt(a.p.h)} x ${fmt(a.p.d)}`, a.pos.join(', '), a.facings, a.units, fmt(a.cub, 0)]);
    doc.autoTable({...tbl, startY:section('Faceamento por produto', doc.lastAutoTable.finalY + 10), head:[['Código', 'EAN', 'Produto', 'Categoria', 'L x A x P (cm)', 'Posições', 'Frentes', 'Unidades', 'Cubagem (cm3)']],
      body:prodRows, showFoot:'lastPage', foot:[['', '', 'Total', '', '', '', T.facings, T.units, fmt(agg.reduce((s, a) => s + a.cub, 0), 0)]],
      footStyles:{fillColor:[241, 245, 250], textColor:INK, fontStyle:'bold'}, columnStyles:{...right(6), ...right(7), ...right(8)},
    });
    // ocupação por bandeja
    const shelfRows = [];
    EL.mods.forEach(Md => Md.shelves.forEach(E => { const sh = E.shelf;
      shelfRows.push([pdfTxt(Md.mod.name), E.si + 1, fmt(sh.width), fmt(sh.height), fmt(sh.depth), fmt(E.usedCm), fmt(sh.width ? E.usedCm / sh.width * 100 : 0, 0) + '%',
        fmt(Math.max(0, sh.width - E.usedCm)), E.items.reduce((a, I) => a + I.item.facings, 0), E.items.reduce((a, I) => a + I.calc.units, 0)]); }));
    doc.autoTable({...tbl, startY:section('Ocupação por bandeja', doc.lastAutoTable.finalY + 10), head:[['Módulo', 'Bandeja', 'Largura', 'Altura útil', 'Profund.', 'Ocupado', 'Ocupação', 'Livre', 'Frentes', 'Unidades']],
      body:shelfRows, columnStyles:{1:{halign:'center'}, ...right(2), ...right(3), ...right(4), ...right(5), ...right(6), ...right(7), ...right(8), ...right(9)}});
    // alertas e observações
    const al = computeAlerts();
    const extra = [];
    if (al.length) al.forEach(a => extra.push(['Alerta', pdfTxt(a.text)]));
    if (info.notes) extra.push(['Observações', pdfTxt(info.notes)]);
    if (extra.length) doc.autoTable({...tbl, startY:section('Alertas e observações', doc.lastAutoTable.finalY + 10), head:[['Tipo', 'Descrição']], body:extra, columnStyles:{0:{cellWidth:28, fontStyle:'bold'}}});
    // rodapé
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++){ doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
      doc.text('SoftPlan 1.0', M, PH - 6); doc.text(`Página ${i} de ${n}`, PW - M, PH - 6, {align:'right'}); }
    await saveFile(fileBase() + '.pdf', doc.output('blob'));
  } catch(err){ toast('Não foi possível gerar o PDF: ' + (err && err.message || err)); }
  btn.disabled = false; btn.textContent = 'Exportar PDF';
}
function fileBase(){ return (S.plan.name || 'planograma').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 80) || 'planograma'; }

let dlNS;
async function saveFile(name, data){
  try {
    if (dlNS === undefined) dlNS = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dlNS){ await dlNS.save({filename:name, data}); toast('Arquivo salvo: ' + name); return; }
  } catch(e){
    if (e && e.code === 'declined') return toast('Download cancelado.');
    if (e && e.code === 'rate_limited') return toast('Já existe um download aguardando confirmação.');
    if (e && e.code === 'too_large') return toast('Arquivo grande demais para salvar por aqui.');
  }
  const blob = data instanceof Blob ? data : new Blob([data], {type:'application/json'});
  if (window.claude){ showSaveModal(name, blob, typeof data === 'string' ? data : null); return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
on('bExport', exportPNG); on('bPdf', exportPDF);
/* Caminho alternativo quando o link compartilhado não permite download direto */
let modalUrl = null;
function closeModal(){ $('#saveModal').hidden = true; $('#smBody').innerHTML = ''; if (modalUrl){ URL.revokeObjectURL(modalUrl); modalUrl = null; } }
function showSaveModal(name, blob, text){
  const ext = name.split('.').pop().toLowerCase(); modalUrl = URL.createObjectURL(blob);
  $('#smTitle').textContent = name;
  let h = '';
  if (ext === 'png') h = `<p class="note">Clique com o botão direito na imagem e escolha <b>Salvar imagem como</b>. No celular, toque e segure a imagem.</p><div class="smimg"><img src="${modalUrl}" alt="Planograma"></div>`;
  else if (ext === 'pdf') h = `<p class="note">Use o botão de download do visualizador abaixo. Se ele não baixar neste link, abra o SoftPlan pelo arquivo próprio, onde o download funciona direto.</p><iframe class="smpdf" src="${modalUrl}" title="PDF do planograma"></iframe>`;
  else if (ext === 'xlsx') h = `<p class="note">Este link não permite baixar planilhas direto. Abra o SoftPlan pelo arquivo próprio (SoftPlan-1.0.html) para exportar a tabela.</p>`;
  else h = `<p class="note">Este link não permite baixar arquivos direto. Copie o projeto e guarde de um destes jeitos:</p>
    <ol class="note smlist"><li>Cole num Bloco de Notas e salve com o nome <b>${esc(name)}</b>. Depois é só usar <b>Abrir projeto</b>.</li>
    <li>Ou, para continuar em outro computador, abra o SoftPlan lá e aperte <span class="kbd">Ctrl+V</span> fora dos campos de texto. O projeto abre na hora.</li></ol>
    <div class="btnrow"><button class="btn primary" id="smCopy">Copiar projeto</button><span class="note">${fmt(blob.size / 1048576, 1)} MB</span></div>`;
  $('#smBody').innerHTML = h; $('#saveModal').hidden = false;
  on('smCopy', async () => {
    try { await navigator.clipboard.writeText(text); toast('Projeto copiado. Cole no Bloco de Notas ou no SoftPlan.'); }
    catch(e){ toast('Não foi possível copiar. Abra o SoftPlan pelo arquivo próprio para salvar.'); }
  });
}
on('smClose', closeModal);
$('#saveModal').addEventListener('pointerdown', e => { if (e.target.id === 'saveModal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#saveModal').hidden) closeModal(); });

/* ===== Projeto (arquivo .json) ===== */
function snapshot(){ const keep = {}, ko = {}; S.products.forEach(p => { if (imgs[p.id]) keep[p.id] = imgs[p.id]; if (origs[p.id]) ko[p.id] = origs[p.id]; }); return {app:'softplan', version:1, plan:S.plan, products:S.products, imgs:keep, origs:ko}; }
on('bSave', () => saveFile(fileBase() + '.softplan.json', JSON.stringify(snapshot())));
on('bOpen', () => $('#fileProject').click());
function loadProject(text, label){
  try {
    const d = JSON.parse(text);
    if (!d.plan || !Array.isArray(d.products)) throw new Error('formato');
    pushUndo(); Object.keys(urlCache).forEach(k => { if (urlCache[k].startsWith('blob:')) URL.revokeObjectURL(urlCache[k]); });
    urlCache = {}; imgs = d.imgs || {}; origs = d.origs || {}; S = {plan:d.plan, products:d.products}; sanitize(); sel = null;
    renderAll(); requestAnimationFrame(fitZoom); scheduleSave(); toast('Projeto aberto: ' + (S.plan.name || label));
    return true;
  } catch(err){ toast('Este arquivo não é um projeto do SoftPlan válido.'); return false; }
}
$('#fileProject').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  loadProject(await f.text(), f.name);
});

/* ===== Salvamento automático (IndexedDB, por navegador) ===== */
const KV = {
  db:null,
  async open(){ try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('planograma-editor', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch(e){ this.db = null; } },
  get(k){ return new Promise(res => { try { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch(e){ res(null); } }); },
  put(k, v){ return new Promise(res => { try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch(e){ res(false); } }); }
};
let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(async () => {
  if (!KV.db){ $('#saveState').textContent = 'Use “Salvar projeto” para guardar'; return; }
  const ok = await KV.put('project', snapshot());
  $('#saveState').textContent = ok ? 'Salvo neste navegador' : 'Falha ao salvar. Use “Salvar projeto”';
}, 600); }

/* ===== Exemplo inicial (embalagens genéricas, sem marcas) ===== */
function makePack(name, sub, w, h, c1, c2){
  const k = 40, cw = Math.round(w * k), ch = Math.round(h * k);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; const x = cv.getContext('2d');
  x.fillStyle = c1; x.fillRect(0, 0, cw, ch);
  x.fillStyle = c2; x.fillRect(0, 0, cw, ch * 0.2);
  const gr = x.createLinearGradient(0, 0, cw, 0); gr.addColorStop(0, 'rgba(255,255,255,.10)'); gr.addColorStop(.85, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.18)');
  x.fillStyle = gr; x.fillRect(0, 0, cw, ch);
  const px = cw * .08, pw = cw * .84, py = ch * .3, ph = Math.min(ch * .42, cw * .7);
  x.fillStyle = 'rgba(255,255,255,.94)'; rr(x, px, py, pw, ph, Math.min(pw, ph) * .12); x.fill();
  let fs = Math.min(ph * .34, pw / (name.length * .58));
  x.fillStyle = c1; x.font = `bold ${fs}px Arial, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(name, cw / 2, py + ph * .4);
  x.fillStyle = '#444'; x.font = `${Math.min(fs * .55, pw / (sub.length * .5))}px Arial, sans-serif`; x.fillText(sub, cw / 2, py + ph * .74);
  x.fillStyle = 'rgba(255,255,255,.9)'; x.font = `bold ${Math.min(ch * .06, cw * .09)}px Arial, sans-serif`; x.fillText('EXEMPLO', cw / 2, ch * .9);
  return cv.toDataURL('image/png');
}
function sampleProject(){
  const defs = [
    ['Analgésico','20 cápsulas',11,6,3,'#d22f35','#f4f4f4'],
    ['Antigripal','10 sachês',10,12.5,6,'#c8102e','#ffcc00'],
    ['Xarope','120 ml',6.5,15,4.5,'#6a3d9a','#f3c1e0'],
    ['Pastilhas','mel e limão',12,9,2.5,'#e0a400','#fff6d6'],
    ['Spray nasal','15 ml',4.5,15.5,3,'#1c5fa8','#e8f1fb'],
    ['Antiácido','12 comprimidos',13,7,3,'#0e8f6e','#d8f3ea'],
    ['Infantil','suspensão 100 ml',6.5,14,4,'#7b3fa0','#ffd34d'],
    ['Curativos','10 unidades',9,12,2,'#b7202e','#f6e3c8'],
    ['Teste rápido','1 unidade',7,18,3,'#0f3d7a','#ffffff'],
    ['Antialérgico','7 comprimidos',10,7,2,'#3f9d48','#fff176']
  ];
  const products = defs.map(d => { const id = uid(); imgs[id] = makePack(d[0], d[1], d[2], d[3], d[5], d[6]);
    return {id, name:d[0] + ' ' + d[1], code:'EX' + String(defs.indexOf(d) + 1).padStart(3, '0'), brand:'', category:'Exemplo', ean:'', w:d[2], h:d[3], d:d[4], sample:true}; });
  const P = Object.fromEntries(defs.map((d, i) => [d[0], products[i].id]));
  const it = (name, f) => ({id:uid(), productId:P[name], facings:f});
  const s1 = {id:uid(), width:120, height:22, items:[it('Analgésico',2), it('Antialérgico',2), it('Antigripal',2), it('Pastilhas',1), it('Spray nasal',2), it('Antiácido',1)], segments:[]};
  const s2 = {id:uid(), width:120, height:22, items:[it('Infantil',2), it('Xarope',2), it('Curativos',2), it('Teste rápido',2), it('Antiácido',2)], segments:[]};
  return {plan:{name:'Planograma de exemplo', gap:0.4, legends:[], modules:[{id:uid(), name:'Módulo 1', shelves:[s1, s2]}]}, products};
}

/* ===== Utilidades ===== */
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ===== Início ===== */
(async function init(){
  await KV.open();
  const saved = KV.db ? await KV.get('project') : null;
  if (saved && saved.plan && Array.isArray(saved.products)){ S = {plan:saved.plan, products:saved.products}; imgs = saved.imgs || {}; origs = saved.origs || {}; }
  else S = sampleProject();
  sanitize();
  renderAll();
  requestAnimationFrame(fitZoom);
  if (document.fonts) document.fonts.ready.then(() => renderCanvas());
  $('#saveState').textContent = KV.db ? (saved ? 'Salvo neste navegador' : '') : 'Use “Salvar projeto” para guardar';
  if (!saved) scheduleSave();
})();
</script>
